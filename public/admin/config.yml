# Po utworzeniu strony w Decap Turbo wklej jej identyfikator w pole turbo_site_id poniżej.
# Panel i repozytorium używają darmowych planów dla jednej osoby prowadzącej stronę.
backend:
  name: turbo-github
  turbo_site_id: 'UZUPELNIJ_ID_Z_DECAP_TURBO'
  branch: main

publish_mode: simple
media_folder: 'public/zalaczniki'
public_folder: '/zalaczniki'

collections:
  - name: 'wnioski'
    label: 'Wnioski'
    folder: 'src/content/wnioski'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Tytuł', name: 'tytul', widget: 'string' }
      - { label: 'Instytucja', name: 'instytucja', widget: 'string', required: false }
      - label: 'Dokument (główny, do podglądu)'
        name: 'dokument'
        widget: 'file'
        required: false
        hint: 'PDF lub skan wniosku — pokazany jako podgląd na stronie sprawy.'
      - label: 'Przebieg sprawy'
        name: 'kroki'
        widget: 'list'
        hint: 'Dodaj osobny wpis przy każdym ważnym wydarzeniu, np. wysłaniu pisma lub otrzymaniu odpowiedzi.'
        fields:
          - label: 'Status'
            name: 'status'
            widget: 'select'
            options:
              - { label: 'Złożony', value: 'zlozony' }
              - { label: 'Oczekiwanie na odpowiedź', value: 'oczekiwanie_na_odpowiedz' }
              - { label: 'Oczekiwanie na odwołanie', value: 'oczekiwanie_na_odwolanie' }
              - { label: 'Załatwiony', value: 'zalatwiony' }
              - { label: 'Odrzucony', value: 'odrzucony' }
          - { label: 'Data', name: 'data', widget: 'datetime', format: 'YYYY-MM-DD' }
          - { label: 'Opis (opcjonalnie)', name: 'opis', widget: 'text', required: false }
          - label: 'Ile dni urząd ma na odpowiedź lub kolejny krok?'
            name: 'deadlineDni'
            widget: 'number'
            required: false
            value_type: 'int'
            min: 1
            max: 366
            default: 14
            hint: 'Opcjonalnie. Zostaw puste, jeśli nie chcesz pokazywać terminu.'
      - label: 'Pozostałe załączniki'
        name: 'zalaczniki'
        widget: 'list'
        required: false
        fields:
          - { label: 'Nazwa', name: 'nazwa', widget: 'string' }
          - { label: 'Plik', name: 'plik', widget: 'file' }
      - { label: 'Opis sprawy i jej przebiegu', name: 'body', widget: 'markdown', hint: 'Napisz krótko, czego dotyczy sprawa. Możesz opisać odpowiedzi i swoje dalsze działania.' }
