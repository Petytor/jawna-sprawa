name: Skonfiguruj nową instancję

# Uruchamia się przy każdym pushu, ale realnie robi coś tylko raz — zaraz po wygenerowaniu
# repozytorium z szablonu przyciskiem "Use this template" na GitHubie. Wpisuje nazwę repo
# do public/admin/config.yml i przybliżony adres strony do astro.config.mjs, żeby
# osoba klikająca szablon nie musiała ręcznie edytować żadnego pliku.
#
# Bezpieczne od pętli: sprawdza najpierw, czy placeholder jeszcze tam jest — po pierwszej
# udanej podmianie kolejne uruchomienia (także ten sam commit, który sam tworzy) nic nie robią.
on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  configure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Podmień placeholdery na dane tego repozytorium
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REPO_NAME="${REPO#*/}"
          GUESSED_URL="https://${REPO_NAME}.pages.dev"

          # "|" jako separator sed — "#" pojawia się dosłownie w podmienianym tekście (komentarz YAML).
          sed -i "s|^  repo: petytor/jawna-sprawa # PLACEHOLDER.*|  repo: ${REPO}|" public/admin/config.yml
          sed -i "s|^const SITE_URL = 'https://przyklad.jawnasprawa.pl';|const SITE_URL = '${GUESSED_URL}'; // zgadnięte — po podpięciu własnej domeny zmień ręcznie|" astro.config.mjs

      - name: Zacommituj, jeśli coś się zmieniło
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nic do zrobienia — konfiguracja już ustawiona wcześniej."
            exit 0
          fi
          git add public/admin/config.yml astro.config.mjs
          git commit -m "chore: configure new instance (${{ github.repository }})"
          git push
