# Podmieniane automatycznie przy pierwszym uruchomieniu przez
# .github/workflows/configure-on-first-run.yml — nie edytuj repo/site_domain ręcznie,
# zostaną nadpisane. Backend: Decap Turbo (https://decapcms.org/docs/turbo-overview/) —
# darmowe hostowane uwierzytelnianie, bez własnego serwera OAuth. Alternatywa (własny worker)
# opisana w README.
backend:
  name: turbo-github
  repo: petytor/jawna-sprawa # PLACEHOLDER — nadpisywane automatycznie
  branch: main

publish_mode: simple
media_folder: 'src/assets/zalaczniki'
public_folder: '/zalaczniki'

collections:
  - name: 'wnioski'
    label: 'Wnioski'
    folder: 'src/content/wnioski'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    fields:
      - { label: 'Tytuł', name: 'tytul', widget: 'string' }
      - { label: 'Instytucja', name: 'instytucja', widget: 'string', required: false }
      - label: 'Dokument (główny, do podglądu)'
        name: 'dokument'
        widget: 'file'
        required: false
        hint: 'PDF lub skan wniosku — pokazany jako podgląd na stronie sprawy.'
      - label: 'Oś czasu'
        name: 'kroki'
        widget: 'list'
        hint: 'Kolejność nie ma znaczenia — sortowane są automatycznie wg daty.'
        fields:
          - label: 'Status'
            name: 'status'
            widget: 'select'
            options:
              - { label: 'Złożony', value: 'zlozony' }
              - { label: 'Oczekiwanie na odpowiedź', value: 'oczekiwanie_na_odpowiedz' }
              - { label: 'Oczekiwanie na odwołanie', value: 'oczekiwanie_na_odwolanie' }
              - { label: 'Załatwiony', value: 'zalatwiony' }
              - { label: 'Odrzucony', value: 'odrzucony' }
          - { label: 'Data', name: 'data', widget: 'datetime', format: 'YYYY-MM-DD' }
          - { label: 'Opis (opcjonalnie)', name: 'opis', widget: 'text', required: false }
          - label: 'Termin na wyjście z tego statusu (dni)'
            name: 'deadlineDni'
            widget: 'number'
            required: false
            value_type: 'int'
            min: 1
            max: 366
            default: 14
            hint: 'Zostaw puste, jeśli ten status nie ma ustawowego/umownego terminu.'
      - label: 'Pozostałe załączniki'
        name: 'zalaczniki'
        widget: 'list'
        required: false
        fields:
          - { label: 'Nazwa', name: 'nazwa', widget: 'string' }
          - { label: 'Plik', name: 'plik', widget: 'file' }
      - { label: 'Treść', name: 'body', widget: 'markdown' }
